<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SPOTTED · Battle Royale</title>
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0714'/%3E%3Cpath d='M10 55 Q50 20 90 55 Q50 90 10 55Z' fill='none' stroke='%23ff2d55' stroke-width='6'/%3E%3Ccircle cx='50' cy='55' r='12' fill='%23ff2d55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/partida.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="oculto">
  <div id="feed"></div>
  <div id="arriba">
    <div id="reloj">15:00</div>
    <div id="vivos">24 VIVOS</div>
    <div id="alerta"></div>
  </div>
  <canvas id="mm" width="256" height="256"></canvas>
  <div id="cruz"><i></i><i></i><i></i><i></i></div>
  <div id="hitm"></div>
  <div id="mira" class="oculto"></div>
  <div id="vig"></div>
  <div id="oscuro"></div>

  <div id="stickZona"><div id="stickBase"><div id="stickBola"></div></div></div>

  <div id="vitales">
    <div class="barra"><i id="bEscudo"></i></div>
    <div class="barra vida"><i id="bVida"></i><span id="tVida">100</span></div>
    <div class="mini"><span>HAMBRE</span><div class="barra2"><i id="bHambre"></i></div><span>STAMINA</span><div class="barra2"><i id="bStamina"></i></div></div>
  </div>
  <div id="armasHud">
    <button class="slot" id="slot0"><b>—</b><small>Principal</small></button>
    <button class="slot" id="slot1"><b>—</b><small>Secundaria</small></button>
    <div id="municion">0 / 0 <small>⚙ 0</small></div>
  </div>

  <div id="botones">
    <button id="bDisparo" class="grande">🔫</button>
    <button id="bApuntar">🎯</button>
    <button id="bSaltar">⤒</button>
    <button id="bAgachar">⤓</button>
    <button id="bRecargar">↻</button>
    <button id="bCurar">💉<small id="nIny">0</small></button>
    <button id="bComer">🫓<small id="nComida">0</small></button>
    <button id="bPlaca">▣<small id="nPlaca">0</small></button>
  </div>
  <button id="bAccion" class="oculto">RECOGER</button>
  <div id="progreso" class="oculto"><div><i></i></div><span></span></div>
  <div id="derribadoTxt" class="oculto"></div>
  <div id="avisos"></div>
  <div id="anfitrion" class="oculto"><canvas id="anfCara" width="96" height="96"></canvas><p></p></div>
</div>

<!-- pantallas -->
<div id="pIntro" class="pantalla">
  <div class="caja">
    <canvas id="introCara" width="160" height="160"></canvas>
    <div class="quien">EL ANFITRIÓN · DENTRO DEL DRON</div>
    <p id="introTxt"></p>
    <button class="btn" id="bSaltarIntro">SALTAR</button>
  </div>
</div>
<div id="pSalto" class="pantalla oculto">
  <div class="caja ancha">
    <div class="quien">TOCA EL MAPA DONDE QUIERES CAER · <span id="saltoT">15</span> s</div>
    <canvas id="mapaSalto" width="512" height="512"></canvas>
    <button class="btn" id="bSaltarYa">¡SALTAR!</button>
  </div>
</div>
<div id="pFin" class="pantalla oculto">
  <div class="caja" id="finCaja"></div>
</div>
<div id="girar"><b>📱</b>GIRA TU CELULAR<br><span style="color:#9a93b3;font-size:12px">La arena se juega en horizontal</span></div>
<div class="load" id="load"><div class="sp"></div><span id="loadtxt">PREPARANDO LA ARENA…</span></div>

<script type="module" src="js/partida/juego.js"></script>
<script>setTimeout(() => { const t = document.getElementById('loadtxt'); if (t && document.getElementById('load')) t.textContent = 'REVISA TU CONEXIÓN A INTERNET'; }, 15000);</script>
</body>
</html>
